[project]
name = "pixeltable-invoice-audit"
version = "0.1.0"
description = "Invoice line-item audit API: a chain of computed columns from subtotal to tax, total and risk band - built with Pixeltable"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Pierre Brunelle" }]
keywords = ["pixeltable", "multimodal", "ai", "fastapi", "computed-columns", "data-infrastructure", "invoice-audit"]
dependencies = [
    "pixeltable[serve]>=0.7.14",
]

[project.urls]
Homepage = "https://pixeltable.com"
Documentation = "https://docs.pixeltable.com"
Pixeltable = "https://github.com/pixeltable/pixeltable"
